<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    // Apply the saved theme before first paint (same as every original page).
    (function () {
      var t = localStorage.getItem("cadence_theme");
      if (t === "light") document.documentElement.setAttribute("data-theme", "light");
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadence — Every deadline, one clear view</title>
  <meta name="description" content="Cadence is a task management system built for students. Track assignments, projects and deadlines in one calm, premium dashboard." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
